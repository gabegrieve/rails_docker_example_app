# CI-specific compose file used by the Buildkite pipeline (see .buildkite/pipeline.yml).
# Mirrors docker-compose.yml but targets the test environment and lets the
# Postgres version be selected by the test matrix via POSTGRES_VERSION.
services:
  db:
    image: "postgres:${POSTGRES_VERSION:-16}"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      RAILS_ENV: test
      DATABASE_HOST: db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      CI: "true"
      # Surfaced to the suite so the test-collector can attach build metadata.
      BUILDKITE_ANALYTICS_TOKEN: "${BUILDKITE_ANALYTICS_TOKEN:-}"
      BUILDKITE_BUILD_ID: "${BUILDKITE_BUILD_ID:-}"
      BUILDKITE_BRANCH: "${BUILDKITE_BRANCH:-}"
      BUILDKITE_COMMIT: "${BUILDKITE_COMMIT:-}"
    depends_on:
      db:
        condition: service_healthy
