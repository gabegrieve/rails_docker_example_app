# S1 expected graph:
# setup -> uploader -> approval -> 120 numbered commands
# The uploader materializes the fan-out before the approval becomes actionable,
# so the blocked build contains one manual gate plus 120 dependent jobs.
steps:
  - label: "S1 / Setup"
    key: "s1-setup"
    command: "echo 'S1 setup complete'; sleep 3"

  - label: "S1 / Generate 120-job fan-out"
    key: "s1-fanout-uploader"
    command: ".buildkite/fixtures/gates/scripts/generate-fanout.sh | buildkite-agent pipeline upload"
    depends_on: "s1-setup"

  - block: "S1 / Approve release of 120 jobs"
    key: "s1-approval"
    prompt: "Continue releases 120 harmless, numbered jobs. Inspect the Waiting filter first."
    depends_on: "s1-fanout-uploader"
