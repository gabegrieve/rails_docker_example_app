# ─────────────────────────────────────────────────────────────────────────────
# Buildkite feature showcase pipeline
#
# This is intentionally maximalist: it exercises as many Buildkite pipeline
# features as we could reasonably fit into one Rails app. Some steps reference
# org-level resources (queues, Slack notification services, a downstream
# pipeline, an analytics token) that you must wire up for them to do anything —
# those are clearly commented. The default build stays green; risky/external
# bits are gated behind branches, `if:` conditions, or env vars.
#
# See .buildkite/README.md for a feature → location map.
# ─────────────────────────────────────────────────────────────────────────────

# Pipeline-level environment variables (available to every step).
env:
  RAILS_ENV: test
  # Flip to "1" (here or via a build env var) to enable the intentionally flaky
  # test so you can watch retries and Test Analytics flaky detection.
  DEMO_FLAKY: "0"

# Pipeline-level notifications. The GitHub commit status works out of the box;
# Slack/webhook need a notification service configured in your org settings.
notify:
  - github_commit_status:
      context: "buildkite/showcase"
  # - slack: "#builds"
  # - webhook: "https://example.com/buildkite-events"

# No pipeline-level queue targeting: jobs route to the cluster's default queue.
# To target a specific queue, set it via the pipeline's agent targeting field in
# Buildkite settings, or add `agents: { queue: ... }` to individual steps.

steps:
  # ───────────────────────────────────────────────────────────────────────────
  # 0. BUILD SUMMARY (start) — post a build-header style annotation up front so
  #    the build page opens with a quick overview. Runs on the agent directly
  #    (no Docker), in parallel with the build, so it shows up immediately.
  # ───────────────────────────────────────────────────────────────────────────
  - label: ":memo: Build summary"
    command: ".buildkite/scripts/summary-start.sh"

  # ───────────────────────────────────────────────────────────────────────────
  # 1. BUILD — build the app image once via docker-compose so later steps reuse
  #    it. Demonstrates: `key`, the docker-compose plugin (build + image cache),
  #    and artifact_paths.
  # ───────────────────────────────────────────────────────────────────────────
  - label: ":docker: Build image"
    key: build
    command:
      - "echo '--- Recording build metadata'"
      - "git rev-parse HEAD > build-sha.txt"
      - "buildkite-agent meta-data set build-sha \"$(cat build-sha.txt)\""
    artifact_paths:
      - "build-sha.txt"
    plugins:
      - docker-compose#v5.10.0:
          # Build the web service. Downstream steps re-run `docker-compose run`
          # against the same config; the agent's Docker layer cache keeps that
          # cheap. (We intentionally don't `push` to a registry here — that
          # requires an authenticated container registry, which this showcase
          # doesn't assume. See README for how to enable cross-step image cache.)
          build: web
          config: docker-compose.ci.yml

  # An explicit `wait` so nothing past this point starts until the image exists.
  - wait

  # ───────────────────────────────────────────────────────────────────────────
  # 2. LINT & SECURITY — a `group` of steps that run in parallel. Demonstrates:
  #    group steps, running commands inside the built image (docker-compose
  #    `run`), and `soft_fail` (audits report but don't block the build).
  # ───────────────────────────────────────────────────────────────────────────
  - group: ":lock_with_ink_pen: Lint & Security"
    key: quality
    steps:
      - label: ":rubocop: Style"
        command: "bin/rubocop -f github"
        plugins:
          - docker-compose#v5.10.0:
              run: web
              config: docker-compose.ci.yml

      - label: ":lock: Brakeman"
        command: "bin/brakeman --quiet --no-pager"
        # Security findings annotate the build but don't fail it.
        soft_fail:
          - exit_status: "*"
        plugins:
          - docker-compose#v5.10.0:
              run: web
              config: docker-compose.ci.yml

      - label: ":ruby: Bundler audit"
        command: "bin/bundler-audit --update"
        soft_fail: true
        plugins:
          - docker-compose#v5.10.0:
              run: web
              config: docker-compose.ci.yml

      - label: ":javascript: Importmap audit"
        command: "bin/importmap audit"
        soft_fail: true
        plugins:
          - docker-compose#v5.10.0:
              run: web
              config: docker-compose.ci.yml

  # ───────────────────────────────────────────────────────────────────────────
  # 3. TESTS — the heart of the showcase. Demonstrates: matrix builds with
  #    adjustments, parallelism, retry (automatic + manual), timeouts,
  #    artifact_paths, and the test-collector + artifacts plugins.
  # ───────────────────────────────────────────────────────────────────────────
  - group: ":test_tube: Tests"
    key: tests
    steps:
      - label: ":rails: Ruby tests {{matrix.ruby}} / pg{{matrix.postgres}}"
        key: ruby_tests
        timeout_in_minutes: 15
        # Two-dimension matrix: Ruby version × Postgres version.
        matrix:
          setup:
            ruby: ["3.4", "3.3"]
            postgres: ["16", "15"]
          adjustments:
            # Mark a bleeding-edge combo as allowed-to-fail.
            - with: { ruby: "3.3", postgres: "15" }
              soft_fail: true
            # Skip a combo we don't care about.
            - with: { ruby: "3.3", postgres: "16" }
              skip: "covered by the 3.4 matrix"
        env:
          RUBY_VERSION: "{{matrix.ruby}}"
          POSTGRES_VERSION: "{{matrix.postgres}}"
          CI: "true"
          # minitest-reporters + Rails parallel forking don't mix; pin to 1 so
          # the JUnit XML is written in one place.
          PARALLEL_WORKERS: "1"
          # Forces the deliberately-slow unit test to run, holding this step
          # open for a full 2 minutes (see test/unit/text_utils_test.rb).
          DEMO_SLOW: "1"
        # Retry transient infra failures automatically; allow a manual retry too.
        retry:
          automatic:
            - exit_status: -1   # agent lost
              limit: 2
            - exit_status: 255  # forced agent shutdown
              limit: 2
          manual:
            allowed: true
            reason: "Retry if you suspect a flaky test"
        artifact_paths:
          - "test/reports/**/*.xml"
          - "tmp/screenshots/**/*"
        plugins:
          - docker-compose#v5.10.0:
              run: web
              config: docker-compose.ci.yml
        command:
          - "bin/rails db:test:prepare"
          - "bin/rails test"

      - label: ":vitejs: JS tests (Vitest, node {{matrix}})"
        key: js_tests
        timeout_in_minutes: 10
        # Single-dimension matrix over Node versions.
        matrix:
          - "22"
          - "20"
        env:
          NODE_VERSION: "{{matrix}}"
        artifact_paths:
          - "test/reports/vitest-junit.xml"
        plugins:
          - docker-compose#v5.10.0:
              run: web
              config: docker-compose.ci.yml
        command:
          - "npm ci"
          - "npm run test:ci"

      - label: ":chrome: System tests"
        key: system_tests
        timeout_in_minutes: 20
        # Split the suite across 3 parallel jobs; Buildkite's test splitter or
        # the test-collector can balance them.
        parallelism: 3
        # System tests can be flaky on cold browsers; retry once automatically.
        retry:
          automatic:
            limit: 1
        artifact_paths:
          - "tmp/screenshots/**/*"
          - "test/reports/**/*.xml"
        env:
          CI: "true"
          PARALLEL_WORKERS: "1"
        plugins:
          - docker-compose#v5.10.0:
              run: web
              config: docker-compose.ci.yml
        command:
          - "bin/rails db:test:prepare"
          - "bin/rails test:system"

  # `wait: continue_on_failure` lets the annotate step run even if tests failed,
  # so failures still get surfaced as annotations.
  - wait: ~
    continue_on_failure: true

  # ───────────────────────────────────────────────────────────────────────────
  # 4. JUNIT ANNOTATE — turn the JUnit XML artifacts into a build annotation.
  #    Demonstrates: depends_on + allow_dependency_failure and the
  #    junit-annotate plugin.
  # ───────────────────────────────────────────────────────────────────────────
  - label: ":junit: Annotate test failures"
    depends_on:
      - ruby_tests
      - js_tests
      - system_tests
    allow_dependency_failure: true
    plugins:
      - junit-annotate#v2.7.0:
          artifacts: "test/reports/**/*.xml"
          report-slug: "rails-and-js"
          context: "junit"

  # ───────────────────────────────────────────────────────────────────────────
  # 4b. BUILD SUMMARY (end) — tally the JUnit reports into a pass/fail verdict
  #     annotation, mirroring the results panel in the UI. Allowed to run even
  #     when tests fail so the summary still posts.
  # ───────────────────────────────────────────────────────────────────────────
  - label: ":memo: Build summary (results)"
    depends_on:
      - ruby_tests
      - js_tests
      - system_tests
    allow_dependency_failure: true
    command: ".buildkite/scripts/summary-end.sh"

  # ───────────────────────────────────────────────────────────────────────────
  # 5. ANNOTATIONS, META-DATA & DYNAMIC UPLOAD — agent CLI features.
  #    Demonstrates: buildkite-agent annotate (all styles), meta-data get/set,
  #    artifact download, and dynamic `pipeline upload`.
  # ───────────────────────────────────────────────────────────────────────────
  - label: ":memo: Annotations & metadata demo"
    depends_on: build
    plugins:
      - artifacts#v1.9.4:
          download: "build-sha.txt"
    command:
      - "echo '--- Reading build metadata'"
      - "buildkite-agent meta-data get build-sha"
      - "echo '--- Writing annotations in every style'"
      - ".buildkite/scripts/annotate.sh"
      - "echo '--- Uploading additional steps dynamically'"
      - ".buildkite/scripts/dynamic.sh | buildkite-agent pipeline upload"

  # ───────────────────────────────────────────────────────────────────────────
  # 6. INPUT — collect data from a human without it being a hard gate.
  #    Demonstrates: input step with text/select fields.
  # ───────────────────────────────────────────────────────────────────────────
  - input: ":pencil2: Release notes"
    key: release_notes
    # Only ask on the default branch.
    if: build.branch == "main"
    fields:
      - text: "Summary"
        key: summary
        hint: "One line for the changelog"
        required: false
      - select: "Risk"
        key: risk
        default: low
        options:
          - { label: "🟢 Low", value: low }
          - { label: "🟡 Medium", value: medium }
          - { label: "🔴 High", value: high }

  # ───────────────────────────────────────────────────────────────────────────
  # 7. BLOCK + ANNOTATE — a manual gate that also demonstrates rich HTML
  #    annotations (kept from the original pipeline). Demonstrates: block step
  #    fields (text/select), and re-uploading itself.
  # ───────────────────────────────────────────────────────────────────────────
  - block: ":pause_button: Custom annotation"
    key: annotate_block
    blocked_state: passed
    fields:
      - text: "Annotation body (HTML allowed)"
        key: body
        default: |
          <h4>Coverage</h4>
          <dl class="flex flex-wrap mxn1">
            <div class="m1"><dt>New files</dt><dd><big><big>88</big></big>%</dd></div>
            <div class="m1"><dt>Changed files</dt><dd><big><big>89</big></big>%</dd></div>
            <div class="m1"><dt>All files</dt><dd><big><big>90</big></big>%</dd></div>
          </dl>
      - select: "Style"
        key: style
        default: info
        options:
          - { label: "✏️ Default", value: default }
          - { label: "ℹ️ Information", value: info }
          - { label: "⚠️ Warning", value: warning }
          - { label: "🚫 Error", value: error }
          - { label: "✅ Success", value: success }
      - select: "Append?"
        key: append
        default: no-append
        options:
          - { label: "Yes", value: append }
          - { label: "No", value: no-append }

  - label: ":bk: Render custom annotation"
    depends_on: annotate_block
    command: |
      buildkite-agent meta-data get body | \
        buildkite-agent annotate \
          --style "$(buildkite-agent meta-data get style)" \
          $([[ $(buildkite-agent meta-data get append) == 'append' ]] && echo '--append')

  # ───────────────────────────────────────────────────────────────────────────
  # 8. DEPLOY — gated, main-only. Demonstrates: branch filtering, concurrency +
  #    concurrency_group (serialize deploys), priority, cancel_on_build_failing,
  #    a manual block gate, and a `trigger` step into a downstream pipeline.
  # ───────────────────────────────────────────────────────────────────────────
  - group: ":rocket: Deploy"
    key: deploy
    # Whole group only appears on the default branch.
    if: build.branch == "main" && build.source != "schedule"
    steps:
      - block: ":shipit: Deploy to production?"
        key: deploy_gate
        prompt: "Ship this build?"

      - label: ":rocket: Deploy"
        key: deploy_run
        depends_on: deploy_gate
        branches: "main"
        priority: 10
        cancel_on_build_failing: true
        # Never run two production deploys at once across all builds.
        concurrency: 1
        concurrency_group: "${BUILDKITE_PIPELINE_SLUG}/deploy/production"
        command:
          - "echo '--- Deploying'"
          - "echo 'kamal deploy   # (placeholder — wire up real credentials to enable)'"
          - "buildkite-agent annotate ':rocket: Deployed ${BUILDKITE_COMMIT:0:7} to production' --style success --context deploy"

      # Kick off a downstream pipeline (e.g. smoke tests or docs). Requires a
      # pipeline with this slug to exist in your org.
      - trigger: "downstream-smoke-tests"
        label: ":link: Trigger smoke tests"
        depends_on: deploy_run
        async: true
        # Don't fail this build if the downstream pipeline can't be triggered.
        soft_fail: true
        build:
          message: "Smoke tests for ${BUILDKITE_MESSAGE}"
          commit: "${BUILDKITE_COMMIT}"
          branch: "${BUILDKITE_BRANCH}"
          env:
            TRIGGERED_FROM: "${BUILDKITE_PIPELINE_SLUG}"

  # ───────────────────────────────────────────────────────────────────────────
  # MONOREPO-DIFF (commented example) — only upload sub-pipelines for the parts
  # of a monorepo that changed. Left here as a reference for larger repos.
  # ───────────────────────────────────────────────────────────────────────────
  # - label: ":mag: Detect changes"
  #   plugins:
  #     - monorepo-diff#v1.3.0:
  #         diff: "git diff --name-only $(git merge-base origin/main HEAD)"
  #         watch:
  #           - path: "app/javascript/"
  #             config:
  #               command: "echo 'JS changed — run JS-only steps'"
