# Select before uploading: Buildkite validates queues even in if-false groups.
# The core scenario must not submit any hosted-queue references.
steps:
  - label: ":pipeline: Load waiting-job scenario"
    key: load-waiting-job-scenario
    agents:
      queue: wait-lab-control
    timeout_in_minutes: 2
    command: |
      set -euo pipefail
      case "$${WAIT_LAB_MODE:-core}" in
        core|hosted-images|hosted-limit|platform-limit)
          echo "Loading waiting-job scenario: $${WAIT_LAB_MODE:-core}"
          buildkite-agent pipeline upload ".buildkite/pipeline.$${WAIT_LAB_MODE:-core}.yml"
          ;;
        *)
          echo "Unknown WAIT_LAB_MODE; use core, hosted-images, hosted-limit, or platform-limit." >&2
          exit 1
          ;;
      esac
