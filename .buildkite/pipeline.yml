# Block, input, and wait UX exploration dispatcher.
#
# Set GATE_FIXTURE when creating a build (for example, "02-chained-approvals").
# The upload script uses 01-fanout by default and accepts only committed fixture
# names, so this throwaway pipeline is safe to trigger repeatedly.
steps:
  - label: ":pipeline: Upload gate UX fixture"
    key: "fixture-dispatcher"
    command: ".buildkite/fixtures/gates/scripts/upload-fixture.sh"
