agents:
  queue: default

steps:
  - label: ":javascript: JavaScript tests and build"
    key: javascript
    command: |
      set -e
      buildkite-agent cache restore --name npm
      docker run --rm --user "$$(id -u):$$(id -g)" -e HOME=/tmp \
        -e npm_config_cache=/app/tmp/npm-cache \
        -v "$$PWD:/app" -w /app node:24-bookworm-slim \
        sh -ec 'npm ci --prefer-offline && npm run test:ci && npm run build'
      buildkite-agent cache save --name npm
    artifact_paths:
      - "test/reports/vitest-junit.xml"
    timeout_in_minutes: 10

  - label: ":ruby: Ruby tests and lint"
    key: ruby
    command: bash .buildkite/test-ruby bin/rails test
    artifact_paths:
      - "test/reports/ruby/**/*.xml"
    timeout_in_minutes: 20

  - label: ":chrome: Browser tests"
    key: browser
    command: bash .buildkite/test-ruby bin/rails test:system
    artifact_paths:
      - "test/reports/browser/**/*.xml"
      - "tmp/screenshots/**/*"
    timeout_in_minutes: 20
